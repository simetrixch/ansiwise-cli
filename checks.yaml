# Every check this repository makes, and the file that carries it.
#
# WHY THIS FILE EXISTS. `dart test` discovers whatever is on disk and reports whether any of it
# failed. Delete a check file and nothing fails: the check is simply not there, and the run prints
# that every check is green. It is worse than a missing test, because a check and its counter-probe
# live in the same file — the thing that would have noticed goes with the thing it was watching.
#
# So the suite does not ask the disk what it checks. It is told here, and
# test/checks/declared_checks_test.dart holds the disk against this file, naming whatever vanished.
#
# WHAT THIS REPOSITORY CHECKS IS ITS GATE AND ITS COMPOSITION. It holds no steps: it is the
# composition root, and what it decides is which plugins are compiled into the binary. The checks
# that read a single plugin's registry live with that plugin; the one check that needs the registry
# the customer actually receives — every shipped program file resolving against the shipped plugin
# set — lives here, because this is the only package that can compose that registry.
#
# FORMAT. `<check>: <file, relative to this file>`, one per line, the reason on the comment line
# directly above it. It is read line by line and the reader imports nothing but dart:io, because the
# same reading is done by gate programs that have to start on a fresh clone where no package has
# been resolved.
#
# ADDING A CHECK MEANS ADDING A LINE. A check file that is not declared here is reported too: an
# undeclared check is one nobody agreed to, and it is how a suite grows a file that judges nothing.

# The analyzer and the formatter really are started with the flags the gate claims, and a fault that
# only reports at info still turns the tree red.
analysis: test/checks/analysis_check_test.dart
# The analyzer and the formatter find nothing to change in THIS package tree. The entry above
# proves the gate starts them correctly; this one is the answer they give about this tree, asked
# from the suite so a plain dart test says it too.
tree-analysis: test/checks/analysis_test.dart
# This file agrees with the suite on disk, and the refusal that enforces it can really go red.
declared-checks: test/checks/declared_checks_test.dart
# Every program file of the installation loads and binds every name to the registry this binary
# ships, and the reading states how many programs and how many steps it covered — the first gate of
# the design, run in the tree so a step deleted from a plugin turns this repository red rather than
# a machine.
config-validity: test/checks/config_validity_test.dart
# The installation's own configuration composes into a registry this binary can offer: every plugin
# it turns on is compiled in, and every condition it names binds to a generic one that is. It is the
# earliest refusal there is — it ends the binary at start-up, for every program on every machine —
# and the configuration is written in one repository while the binary is built from another, so
# nothing but a check that reads both can notice.
configuration-composes: test/checks/configuration_composes_test.dart
# The one executable that travels to a machine is compiled from the composition root, and a compiler
# that refused is reported as a failure carrying its own words instead of as a binary nobody has. The
# directory the artifact goes into is made first, because the compiler writes none.
binary-build: test/checks/binary_build_test.dart
# Which packages of a tree the gate is about to check — the denominator every other check is run once
# per entry of. A manifest at a root with no code declares a workspace and is not counted as a
# package of its own, and a manifest under a build output or a resolved dependency is not one either.
dart-packages: test/checks/dart_packages_test.dart
# The gate finds every package of the repository it stands in, rather than the one directory its own
# script sits in — which is how it once printed "every check green" over files it had never opened.
gate-tree: test/checks/gate_tree_test.dart
# The gate files that judge nothing are one text in every repository that has a gate — a repair that
# lands in one copy and not the other is what this reports.
shared-gate: test/checks/shared_gate_test.dart
# lib/plugins.dart is what plugins.yaml says — the one file that tells one product's binary from
# another's, generated so a second product needs a manifest rather than a copy of this repository.
plugin-set: test/checks/plugin_set_test.dart
# Every package the gate walks is analysed, formatted and tested, and a package that fails any of
# the three makes the whole gate answer non-zero.
package-gate: test/checks/package_gate_test.dart
# Everything the binary is composed from answered from one place — all working checkouts or all
# pushed commits, and the gate logs which. A mix, half from the working tree and half from what was
# pushed with nothing saying which half is which, is refused naming both halves.
resolved-packages: test/checks/resolved_packages_test.dart
# The one Dart version the checks are true against is enforced by reading this process's own
# version, and every other is refused with both numbers in the refusal.
version-guard: test/checks/version_guard_test.dart

# Every subcommand that executes no step starts under the installation's own configuration. `serve`
# comes through the same entry as a run and can be handed no password — its standard input IS the
# connection — so a refusal placed at that entry takes the whole REST surface away from any
# installation whose elevation comes from the caller. It did, and nothing noticed.
subcommands-start: test/checks/subcommands_start_test.dart

# The resident entry of the surface: `serve --listen <address>` binds, announces the port it really
# stands on, answers the same catalogue over that address, and refuses an address in no accepted
# shape at start — while `serve` without it still speaks over the session's own stdio, which is how
# the first installation of every machine reaches it.
serve-listen: test/checks/serve_listen_test.dart

# The unit that makes the surface outlive the session that installed it: lib/service_unit.dart is
# what ansiwise.service says, the rendering is pulled in at boot, restarts when it dies and keeps
# its detached runs, the address is inside the tailnet range, and the command the unit starts is a
# command this binary parses — which a unit written anywhere else stops being without a word.
service-unit: test/checks/service_unit_test.dart
