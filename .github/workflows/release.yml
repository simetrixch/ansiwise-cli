# =============================================================================
# release — the ONE place anything of ansiwise is built, and the only workflow
# in any of its repositories.
# =============================================================================
#
# ansiwise-cli is the product. ansiwise-core, ansiwise-plugins and ansiwise-checks
# are its parts: they are released by nobody, they carry no workflow, and nothing
# is built in them. Everything that has to happen to turn those four trees into
# the engine a machine downloads happens HERE, once, in this file.
#
# WHY ONE PLACE. A release of its own per part builds nothing — it turns a tag
# into a release page no resolver reads, because a git dependency resolves out of
# the TAG. What such releases really cost is the order between them: one behaviour
# fix takes four rounds, and forty-four refs drift between rounds. The twelve
# plugin packages stand on one commit of ansiwise-checks while the cli and the
# core stand on another, and nothing says so, because nothing compares them.
#
# WHAT STARTS IT. A pushed tag, and nothing else — release/release.sh mints it
# and then waits here for the answer. The version and the channel in the tag are
# typed by a person: which release a change deserves, and how ripe it is, are
# decisions.
#
# WHAT IT DOES, IN ORDER. Loads all four trees at the commits this release names,
# lints and tests every one of them, and only then builds the executable. A part
# that is red stops the release before a binary exists, which is the whole reason
# they are loaded here rather than trusted.
name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-alpha-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'
      - '[0-9]+.[0-9]+.[0-9]+-beta-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'
      - '[0-9]+.[0-9]+.[0-9]+-stable-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  BINARIES: ansiwise ansiwise-rest

jobs:
  # ── every tree this engine is made of, linted and tested ───────────────────
  gate:
    name: the gate over every part
    runs-on: ubuntu-latest
    # THE PRODUCT STANDS IN A DIRECTORY OF ITS OWN, and the parts beside it rather
    # than inside it. A part checked out UNDER the product's root is inside the
    # package pub resolves, and pub then answers some dependencies from those
    # directories and the rest from the commits the manifest names - which is the
    # mixed composition the gate refuses: a binary half from a working tree and
    # half from what was pushed. Side by side, every dependency comes from the
    # cache and the composition is uniform.
    defaults:
      run:
        working-directory: product
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: product
      - id: pin
        name: read the pinned Dart version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/^const String dartVersion = '\(.*\)';\$/\1/p" tool/gate/pins.dart)"
          test -n "$version"
          echo "dart=$version" >> "$GITHUB_OUTPUT"

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: ${{ steps.pin.outputs.dart }}

      # THE PARTS ARE LOADED AT THE COMMITS THIS MANIFEST NAMES, never at a
      # branch. What the build resolves and what this job judges are then the
      # same trees; a job that tested the tip while the build resolved a commit
      # would be green about something the release does not contain.
      - id: parts
        name: read the commit of each part out of the manifest
        shell: bash
        run: |
          set -euo pipefail
          for repo in ansiwise-core ansiwise-plugins ansiwise-checks; do
            ref="$(awk -v repo="$repo" '
              $0 ~ "url: https://github.com/simetrixch/" repo "\\.git" { want = 1; next }
              want && /ref:/ { sub(/.*ref:[ \t]*/, ""); print; exit }
            ' pubspec.yaml)"
            test -n "$ref" || { echo "gate: FAIL — pubspec.yaml names no ref for $repo"; exit 1; }
            echo "${repo//-/_}=$ref" >> "$GITHUB_OUTPUT"
            echo "gate: $repo at $ref"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: simetrixch/ansiwise-core
          ref: ${{ steps.parts.outputs.ansiwise_core }}
          path: parts/ansiwise-core

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: simetrixch/ansiwise-plugins
          ref: ${{ steps.parts.outputs.ansiwise_plugins }}
          path: parts/ansiwise-plugins

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: simetrixch/ansiwise-checks
          ref: ${{ steps.parts.outputs.ansiwise_checks }}
          path: parts/ansiwise-checks

      # EACH PART IS JUDGED THE WAY IT JUDGES ITSELF. ansiwise-core carries a
      # gate of its own and it is run as such; the others are packages and are
      # analysed, formatted and tested one by one. A package that grows a gate
      # later is picked up by the same test below without this file changing.
      - name: lint and test every part
        shell: bash
        run: |
          set -euo pipefail
          judge() {
            local dir="$1"
            if [ -f "$dir/tool/ci.dart" ]; then
              echo "::group::$dir — its own gate"
              ( cd "$dir" && dart pub get >/dev/null && dart run tool/ci.dart )
              echo "::endgroup::"
              return 0
            fi
            local package
            for package in "$dir"/*/pubspec.yaml "$dir"/pubspec.yaml; do
              [ -f "$package" ] || continue
              local at; at="$(dirname "$package")"
              [ -d "$at/test" ] || continue
              echo "::group::$at"
              ( cd "$at" \
                && dart pub get >/dev/null \
                && dart analyze --fatal-infos \
                && dart format --output=none --set-exit-if-changed . \
                && dart test )
              echo "::endgroup::"
            done
          }
          judge ../parts/ansiwise-checks
          judge ../parts/ansiwise-core
          judge ../parts/ansiwise-plugins

      - name: dart pub get
        run: dart pub get

      - name: the product's own gate
        run: dart run tool/ci.dart

  # ── the executable ─────────────────────────────────────────────────────────
  build:
    name: the executable
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: pin
        name: read the pinned Dart version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/^const String dartVersion = '\(.*\)';\$/\1/p" tool/gate/pins.dart)"
          test -n "$version"
          echo "dart=$version" >> "$GITHUB_OUTPUT"

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: ${{ steps.pin.outputs.dart }}

      - name: dart pub get
        run: dart pub get

      - name: dart run tool/build.dart
        env:
          TAG: ${{ github.ref_name }}
        run: dart run tool/build.dart build/linux-x64

      - name: name every binary as the release attaches it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/assets
          for binary in $BINARIES; do
            built="build/linux-x64/$binary"
            test -f "$built" || {
              echo "build: FAIL — tool/build.dart wrote no $built"
              exit 1
            }
            mv "$built" "build/assets/$binary-$TAG-linux-x64"
          done
          ls -l build/assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64
          path: build/assets

  # ── the release page ───────────────────────────────────────────────────────
  publish:
    name: the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artefacts
          merge-multiple: true

      # THE NOTES ARE THE SUBJECTS SINCE THE PREVIOUS TAG, and the commit of each
      # part this engine was built from. A commit is what a manifest names, and a
      # reader cannot tell one from another by looking — so the page says which
      # ones went in, which is the legibility a tag carries by itself.
      - id: notes
        name: write the release notes
        shell: bash
        run: |
          set -euo pipefail
          channel="$(cut -d- -f2 <<<"$TAG")"
          case "$channel" in
            stable) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
          esac
          previous="$(git tag --list --sort=-creatordate \
                      '[0-9]*.[0-9]*.[0-9]*-*-[0-9]*' | grep -v "^$TAG$" | head -1 || true)"
          {
            if [ -n "$previous" ]; then
              echo "## Since $previous"
              echo
              git log --no-merges --format='- %s' "$previous..$TAG"
            else
              echo "## The first release on this line"
            fi
            echo
            echo "## The parts this engine was built from"
            echo
            for repo in ansiwise-core ansiwise-plugins ansiwise-checks; do
              ref="$(awk -v repo="$repo" '
                $0 ~ "url: https://github.com/simetrixch/" repo "\\.git" { want = 1; next }
                want && /ref:/ { sub(/.*ref:[ \t]*/, ""); print; exit }
              ' pubspec.yaml)"
              echo "- \`$repo\` at [\`${ref:0:12}\`](https://github.com/simetrixch/$repo/commit/$ref)"
            done
          } > release-notes.md
          cat release-notes.md

      - name: publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.notes.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets=()
          for binary in $BINARIES; do
            asset="artefacts/$binary-$TAG-linux-x64"
            test -f "$asset" || {
              echo "release: FAIL — the release would name $asset with no file behind it"
              exit 1
            }
            assets+=("$asset")
          done
          if [ "$PRERELEASE" = true ]; then set -- --prerelease; else set --; fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "$@" \
            "${assets[@]}"
