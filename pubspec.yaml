name: ansiwise_cli
description: The main CLI executable for Ansiwise.
publish_to: none
version: 0.1.0

executables:
  ansiwise: ansiwise

environment:
  sdk: ^3.12.0

dependencies:
  ansiwise_api:
    git:
      url: https://github.com/simetrixch/ansiwise-api.git
      ref: master
  ansiwise_kubernetes:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: master
      path: ansiwise-kubernetes
  ansiwise_vault:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: master
      path: ansiwise-vault
  ansiwise_vault_kubernetes:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: master
      path: ansiwise-vault-kubernetes
  ansiwise_helm:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: master
      path: ansiwise-helm
  ansiwise_host:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: master
      path: ansiwise-host
  ansiwise_git:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: master
      path: ansiwise-git
  args: ^2.7.0

dev_dependencies:
  test: ^1.31.2
  lints: ^6.1.0
  path: ^1.9.1
  # The audits the gate's own checks are written against. A DEV dependency and not a dependency:
  # nothing the binary does at run time reaches it, so it must not be compiled in. It was reachable
  # only through the gitignored override until now, which meant a clone could not resolve the suite
  # at all — the same split composition that ansiwise-plugins#120 is about, one level down.
  ansiwise_checks:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: master
      path: registry
  # The tree half by name as well, because this package imports it directly for its own
  # tree-analysis check. Reached transitively through the registry half it would resolve and still
  # be an undeclared import, which the analyzer refuses and is right to.
  ansiwise_checks_tree:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: master
      path: tree
