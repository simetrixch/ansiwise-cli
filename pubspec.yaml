name: ansiwise_cli
description: The main CLI executable for Ansiwise.
publish_to: none
version: 0.4.0

# TWO PROGRAMS OUT OF ONE COMPOSITION ROOT. `ansiwise` executes a config flow against this machine;
# `ansiwise-rest` serves the REST surface, over an address or over a session's own pipes, and places
# itself as a service. They share `lib/installation.dart`, which stands up the configuration, the
# active plugins, the machine and the catalogue for both — so a served run and a typed run on one
# machine resolve ONE registry out of ONE plugin list, which is the drift a second binary would
# otherwise introduce.
#
# The name on the left is what a person types; the file on the right is what compiles. They differ
# because a Dart file name is lower_case_with_underscores and a command is not.
executables:
  ansiwise: ansiwise
  ansiwise-rest: ansiwise_rest

environment:
  sdk: ^3.12.0

dependencies:
  ansiwise_core:
    git:
      url: https://github.com/simetrixch/ansiwise-core.git
      ref: 0.2.0-alpha-20260825164254
  # For the annotations the REST message types under lib/src/rest carry, so an immutable one is
  # checked as immutable.
  meta: ^1.15.0
  ansiwise_kubernetes:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: 0.3.1-alpha-20260825164728
      path: ansiwise-kubernetes
  ansiwise_vault:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: 0.3.1-alpha-20260825164728
      path: ansiwise-vault
  ansiwise_vault_kubernetes:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: 0.3.1-alpha-20260825164728
      path: ansiwise-vault-kubernetes
  ansiwise_helm:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: 0.3.1-alpha-20260825164728
      path: ansiwise-helm
  ansiwise_host:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: 0.3.1-alpha-20260825164728
      path: ansiwise-host
  ansiwise_authentik:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      path: ansiwise-authentik
      ref: 0.3.0-alpha-20260825130257
  ansiwise_git:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: 0.3.1-alpha-20260825164728
      path: ansiwise-git
  ansiwise_cloudflare:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: 0.3.1-alpha-20260825164728
      path: ansiwise-cloudflare
  ansiwise_versions:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: 0.3.1-alpha-20260825164728
      path: ansiwise-versions
  ansiwise_headscale:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: 0.3.1-alpha-20260825164728
      path: ansiwise-headscale
  ansiwise_http:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: 0.3.1-alpha-20260825164728
      path: ansiwise-http
  args: ^2.7.0

dev_dependencies:
  test: ^1.31.2
  lints: ^6.1.0
  path: ^1.9.1
  # The audits the gate's own checks are written against. A DEV dependency and not a dependency:
  # nothing the binary does at run time reaches it, so it must not be compiled in. It was reachable
  # only through the gitignored override until now, which meant a clone could not resolve the suite
  # at all — the same split composition that ansiwise-plugins#120 is about, one level down.
  ansiwise_checks:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: 0.2.0-alpha-20260825164540
      path: registry
  # The tree half by name as well, because this package imports it directly for its own
  # tree-analysis check. Reached transitively through the registry half it would resolve and still
  # be an undeclared import, which the analyzer refuses and is right to.
  ansiwise_checks_tree:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: 0.2.0-alpha-20260825164540
      path: tree
