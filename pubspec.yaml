name: ansiwise_cli
description: The main CLI executable for Ansiwise.
publish_to: none
version: 0.8.111

# TWO PROGRAMS OUT OF ONE COMPOSITION ROOT. `ansiwise` executes a config flow against this machine;
# `ansiwise-rest` serves the REST surface, over an address or over a session's own pipes, and places
# itself as a service. They share `lib/installation.dart`, which stands up the configuration, the
# active plugins, the machine and the catalogue for both — so a served run and a typed run on one
# machine resolve ONE registry out of ONE plugin list, which is the drift a second binary would
# otherwise introduce.
#
# The name on the left is what a person types; the file on the right is what compiles. They differ
# because a Dart file name is lower_case_with_underscores and a command is not.
executables:
  ansiwise: ansiwise
  ansiwise-rest: ansiwise_rest

environment:
  sdk: ^3.12.0

dependencies:
  ansiwise_core:
    git:
      url: https://github.com/simetrixch/ansiwise-core.git
      ref: 65e715f9f844be64a6f61ae697ed2ba40aa1522d
  # For the annotations the REST message types under lib/src/rest carry, so an immutable one is
  # checked as immutable.
  meta: ^1.15.0
  ansiwise_kubernetes:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: b9d22e89c3111accc35bdeacc0d91af94d749e3e
      path: ansiwise-kubernetes
  ansiwise_vault:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: b9d22e89c3111accc35bdeacc0d91af94d749e3e
      path: ansiwise-vault
  ansiwise_vault_kubernetes:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: b9d22e89c3111accc35bdeacc0d91af94d749e3e
      path: ansiwise-vault-kubernetes
  ansiwise_helm:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: b9d22e89c3111accc35bdeacc0d91af94d749e3e
      path: ansiwise-helm
  ansiwise_host:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: b9d22e89c3111accc35bdeacc0d91af94d749e3e
      path: ansiwise-host
  ansiwise_authentik:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      path: ansiwise-authentik
      ref: b9d22e89c3111accc35bdeacc0d91af94d749e3e
  ansiwise_git:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: b9d22e89c3111accc35bdeacc0d91af94d749e3e
      path: ansiwise-git
  ansiwise_cloudflare:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: b9d22e89c3111accc35bdeacc0d91af94d749e3e
      path: ansiwise-cloudflare
  ansiwise_versions:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: b9d22e89c3111accc35bdeacc0d91af94d749e3e
      path: ansiwise-versions
  ansiwise_headscale:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: b9d22e89c3111accc35bdeacc0d91af94d749e3e
      path: ansiwise-headscale
  ansiwise_http:
    git:
      url: https://github.com/simetrixch/ansiwise-plugins.git
      ref: b9d22e89c3111accc35bdeacc0d91af94d749e3e
      path: ansiwise-http
  args: ^2.7.0

dev_dependencies:
  test: ^1.31.2
  lints: ^6.1.0
  path: ^1.9.1
  # The audits the gate's own checks are written against. A DEV dependency and not a dependency:
  # nothing the binary does at run time reaches it, so it must not be compiled in. Reachable only
  # through the gitignored override, it leaves a clone unable to resolve the suite at all — the same
  # split composition that ansiwise-plugins#120 is about, one level down.
  ansiwise_checks:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: aae0f297125ba18e16349fccbbd7c311ebb6306f
      path: registry
  # The tree half by name as well, because this package imports it directly for its own
  # tree-analysis check. Reached transitively through the registry half it would resolve and still
  # be an undeclared import, which the analyzer refuses and is right to.
  ansiwise_checks_tree:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: aae0f297125ba18e16349fccbbd7c311ebb6306f
      path: tree
  # THE GATE ITSELF, which this repository ran out of seventeen files under tool/gate/ until eleven
  # of the names had drifted from ansiwise-core's copy of the same eleven. tool/ci.dart,
  # tool/analysis.dart and tool/build.dart compose it; the five files left under tool/gate/ are the
  # RELEASE gate, which is this product's and no other repository's.
  #
  # ALL THREE NAME ONE COMMIT, and that is forced rather than tidy. They are three paths into one
  # repository, and pub resolves one package from one git description — two refs here would put two
  # checkouts of ansiwise-checks into one resolution and be refused before a file is read. These
  # three therefore move together, and they move when the gate moves rather than when a release is
  # cut, because a tool/ci.dart importing a package its own pin does not carry cannot compile.
  ansiwise_checks_gate:
    git:
      url: https://github.com/simetrixch/ansiwise-checks.git
      ref: aae0f297125ba18e16349fccbbd7c311ebb6306f
      path: gate
